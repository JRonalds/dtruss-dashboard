            position: absolute; opacity: 0; visibility: hidden;
            transition: opacity 0.5s ease-in-out; transform-origin: center center;

            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 50px rgba(0, 240, 255, 0.05);

        .slide.active { opacity: 1; visibility: visible; }

        /* Alert Box */

        .alert-title { color: #fca5a5; font-size: 14px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;}
        .alert-content { flex: 1; overflow-y: auto; padding-right: 5px; }
        .alert-item { font-size: 13.5px; margin-bottom: 6px; padding-left: 20px; position: relative; color: #e2e8f0; }
        .alert-item::before { content: '>>'; color: var(--alert-red); position: absolute; left: 0; font-family: 'Share Tech Mono', monospace; font-weight: bold; animation: textBlink 1s infinite;}

        /* Map Container */

            width: 100%; height: 100%; border-radius: 2px;

        .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(150%) saturate(120%); }
        .leaflet-popup-content-wrapper { background: rgba(15,23,42,0.95) !important; color: var(--cyan-glow) !important; border: 1px solid var(--cyan-glow); border-radius: 2px !important; backdrop-filter: blur(5px); }

        /* Progress bars */

        .progress-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; box-shadow: 0 0 10px currentColor;}

    </style>
</head>

        function parseTimeValue(val) {
            if (!val || val === '-') return '-';
            val = String(val).trim();

                if (matches && matches.length >= 5) return `${String(matches[3]).padStart(2, '0')}:${String(matches[4]).padStart(2, '0')}`;
            }
            return val;
        }

        function chunkArray(array, chunkSize) {
            const results = [];
            for (let i = 0; i < (array ? array.length : 0); i += chunkSize) results.push(array.slice(i, i + chunkSize));
            return results.length ? results : [[]];
        }

        function fetchSheetTab(sheetName) {
            return new Promise((resolve) => {
                if (!GOOGLE_SHEET_ID) return resolve(null);
                const callbackName = 'sheet_cb_' + Math.random().toString(36).substring(2, 9);
                const timeout = setTimeout(() => { if (window[callbackName]) { delete window[callbackName]; resolve(null); } }, 15000); 
                window[callbackName] = function(data) {
                    clearTimeout(timeout); delete window[callbackName];
                    resolve(data?.table?.rows ? data.table.rows.map(row => row.c ? row.c.map(cell => cell?.v != null ? String(cell.v) : '') : []) : null);
                };
                const script = document.createElement('script');
                script.src = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=responseHandler:${callbackName}`;
                script.onerror = function() { clearTimeout(timeout); delete window[callbackName]; resolve(null); };
                document.body.appendChild(script);
            });
        }

            return rows.slice(startIndex).filter(isRowNotEmpty).map(r => ({

                            </div>
                            <div class="summary-card">
                                <div class="summary-title">รอบที่ต้องส่งทั้งหมด (REQUIRED)</div>
                                <div class="summary-value" style="color:var(--cyan-glow)">6,322</div>
                                <div class="summary-sub">อ้างอิงไฟล์เช็ก PM + DATA สัญญา</div>
                            </div>
                            <div class="summary-card">
                                <div class="summary-title">ส่งเอกสารยืนยันแล้ว (VERIFIED)</div>
                                <div class="summary-value" style="color:#fff">5,779</div>
                                <div class="summary-sub">รอบการตรวจเช็คที่ยืนยันสำเร็จ</div>
                            </div>
                            <div class="summary-card alert-active">
                                <div class="summary-title">ค้างส่งเอกสาร (PENDING)</div>
                                <div class="summary-value" style="color:#ef4444">543</div>
                                <div class="summary-sub">ACTION REQUIRED</div>
                            </div>
                        </div>
                        <div class="bottom-section">
                            <div class="chart-box" style="flex: 1;">
                                <div class="chart-title">อันดับการส่ง PM รายทีม (กรุงเทพฯ และปริมณฑล)</div>
                                <table class="table-fullheight">
                                    <thead style="display:flex; width:100%;">
                                        <tr style="display:flex; width:100%;">
                                            <th style="width: 8%; text-align: center;">อันดับ</th>
                                            <th style="width: 25%">ชื่อทีม (SQUAD)</th>
                                            <th style="width: 12%; justify-content:center;">ยูนิต</th>
                                            <th style="width: 20%; justify-content:center;">ส่ง/ต้องส่ง</th>
                                            <th style="width: 25%">ความสำเร็จ KPI %</th>
                                            <th style="width: 10%; justify-content:center;">ค้างส่ง</th>
                                        </tr>
                                    </thead>
                                    <tbody>${pmRowsHTML}</tbody>
                                </table>
                            </div>
                            <div class="chart-box" style="width: 320px; background: rgba(34, 197, 94, 0.05); border-top-color: #22c55e; box-shadow: inset 0 0 20px rgba(34, 197, 94, 0.1);">
                                <div class="chart-title" style="color: #22c55e;">ช่างต่างจังหวัด (REGIONAL)</div>
                                <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
                                    <div style="font-family:'Orbitron',sans-serif; font-size: 54px; font-weight: 700; color: #22c55e; text-shadow: 0 0 15px rgba(34,197,94,0.6); margin-bottom: 10px;">100%</div>
                                    <div style="font-family:'Prompt',sans-serif; font-size: 16px; color: var(--cyan-glow); margin-bottom: 10px;">ส่งครบ 6,084 / 6,084 รอบ</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            slideIndex++;

            // --- Slide 5: Top 15 High-Risk Projects ---
            let projectRowsHTML = ytdTopProjects.map((p, idx) => `
                <tr style="display:flex; width:100%;">
                    <td class="col-1" style="font-weight:600; color:#fff; width:25%; justify-content:flex-start;">🏢 ${p.project}</td>
                    <td class="col-2" style="font-family: 'Share Tech Mono', monospace; color:var(--cyan-glow); font-size:16px; font-weight:bold; width:15%; justify-content:center;">${p.calls}</td>
                    <td class="col-3" style="font-family: 'Share Tech Mono', monospace; width:15%; justify-content:center;">${p.general}</td>
                    <td class="col-4" style="font-family: 'Share Tech Mono', monospace; width:15%; justify-content:center;">${p.stuck}</td>
                    <td class="col-5" style="font-family: 'Share Tech Mono', monospace; width:15%; justify-content:center; ${p.trapped > 0 ? 'color:#ef4444; font-weight:700;' : ''}">${p.trapped}</td>
                    <td class="col-6" style="font-family: 'Share Tech Mono', monospace; color:${p.color}; width:15%; justify-content:flex-start;">${p.status}</td>
                </tr>
            `).join('');

            container.innerHTML += `
                <div class="slide" id="slide-${slideIndex}">
                    <div class="laser-line"></div>
                    <div class="slide-header">
                        ${logoHeaderHTML}
                        <div class="slide-title">
                            <span>15 อันดับโครงการเฝ้าระวังสูงสุด (TOP 15 HIGH-RISK WATCHLIST)</span>
                            <span class="slide-date">ข้อมูลสะสมตั้งแต่ ม.ค. - ต.ค. 2569</span>
                        </div>
                    </div>
                    <div class="slide-content">
                        <table class="table-fullheight">
                            <thead style="display:flex; width:100%;">
                                <tr style="display:flex; width:100%;">
                                    <th class="col-1" style="width:25%;">ชื่อโครงการ / สถานที่</th>
                                    <th class="col-2" style="width:15%; justify-content:center;">แจ้งซ่อมรวม</th>
                                    <th class="col-3" style="width:15%; justify-content:center;">ประตู/ทั่วไป</th>
                                    <th class="col-4" style="width:15%; justify-content:center;">ลิฟต์ค้าง</th>
                                    <th class="col-5" style="width:15%; justify-content:center;">พบคนติดค้าง</th>
                                    <th class="col-6" style="width:15%; justify-content:flex-start;">สถานะ (THREAT LEVEL)</th>
                                </tr>
                            </thead>
                            <tbody>${projectRowsHTML}</tbody>
                        </table>
                    </div>
                </div>`;
            slideIndex++;

            // --- Field Team Slides ---
            const teams = [
                { name: 'ทีมทิว (TIW SQUAD)', data: dataTiw },
                { name: 'ทีมเปเล่ (PELE SQUAD)', data: dataPele },
                { name: 'ทีมเจ็ท (JET SQUAD)', data: dataJet },
                { name: 'ทีมช่างนัท (NUT SQUAD)', data: dataNut },
                { name: 'ทีมต่างจังหวัด (REGIONAL)', data: dataUpcountry }
            ];

            teams.forEach(t => {
                const chunks = chunkArray(t.data, MAX_ROWS_PER_PAGE);
                chunks.forEach((chunk, pageIdx) => {
                    const pageText = chunks.length > 1 ? ` (หน้า ${pageIdx + 1}/${chunks.length})` : '';
                    let tableRowsHTML = chunk.length === 0 ? 
                        '<tr style="display:flex; width:100%;"><td style="width:100%; justify-content:center; color:var(--gray-color);">ไม่มีภารกิจในรอบนี้ (NO ACTIVE DIRECTIVES)</td></tr>' : 
                        chunk.map(r => {
                            const stat = currentMode === 'morning' ? r.statusM : r.statusA;
                            const col = currentMode === 'morning' ? r.cM : r.cA;
                            return `<tr style="display:flex; width:100%;">
                                <td style="width:10%; justify-content:flex-start;">${r.name}</td>
                                <td style="width:25%; justify-content:flex-start; color:#fff;">${r.place}</td>
                                <td style="width:10%; justify-content:center; font-family:'Share Tech Mono',monospace; color:var(--cyan-glow);">${r.code}</td>
                                <td style="width:10%; justify-content:center; font-family:'Share Tech Mono',monospace;">${r.qty}</td>
                                <td style="width:20%; justify-content:flex-start;">${r.contact}</td>
                                <td style="width:25%; justify-content:flex-start;" class="status-${col}">${getStatusIcon(col)}${stat}</td>
                            </tr>`;
                        }).join('');

                    container.innerHTML += `
                        <div class="slide" id="slide-${slideIndex}">
                            <div class="laser-line"></div>
                            <div class="slide-header">
                                ${logoHeaderHTML}
                                <div class="slide-title">
                                    <span>รายงานปฏิบัติการภาคสนาม: ${t.name}${pageText}</span>
                                    <span class="slide-date">ACTIVE TASKS: ${t.data.length}</span>
                                </div>
                            </div>
                            <div class="slide-content">
                                <table class="table-fullheight">
                                    <thead style="display:flex; width:100%;">
                                        <tr style="display:flex; width:100%;">
                                            <th style="width: 10%">ชื่อช่าง (OP.)</th>
                                            <th style="width: 25%">สถานที่ / โครงการ</th>
                                            <th style="width: 10%; justify-content:center;">รหัส CODE</th>
                                            <th style="width: 10%; justify-content:center;">จำนวนชั้น</th>
                                            <th style="width: 20%">ผู้ติดต่อ</th>
                                            <th style="width: 25%">สถานะ (${periodStr})</th>
                                        </tr>
                                    </thead>
                                    <tbody>${tableRowsHTML}</tbody>
                                </table>
                            </div>
                        </div>`;
                    slideIndex++;
                });
            });

            // --- Management Slides ---
            const mgmtChunks = chunkArray(dataMgmt, MAX_ROWS_PER_PAGE);
            mgmtChunks.forEach((chunk, pageIdx) => {
                const pageText = mgmtChunks.length > 1 ? ` (หน้า ${pageIdx + 1}/${mgmtChunks.length})` : '';
                let mgmtRowsHTML = chunk.length > 0 ? chunk.map(r => 
                    `<tr style="display:flex; width:100%;">
                        <td style="width:20%; justify-content:flex-start;">${r.name}</td>
                        <td style="width:20%; justify-content:flex-start; color:var(--cyan-glow);">${r.task}</td>
                        <td style="width:60%; justify-content:flex-start; color:#fff;">${currentMode === 'morning' ? r.descM : r.descA}</td>
                    </tr>`
                ).join('') : '<tr style="display:flex; width:100%;"><td style="width:100%; justify-content:center; color:var(--gray-color);">ไม่มีภารกิจในรอบนี้</td></tr>';

                container.innerHTML += `
                    <div class="slide" id="slide-${slideIndex}">
                        <div class="laser-line"></div>
                        <div class="slide-header">
                            ${logoHeaderHTML}
                            <div class="slide-title">
                                <span>รายงานทีมบริหารส่วนกลาง (MANAGEMENT & SPECIAL PROJECTS)${pageText}</span>
                                <span class="slide-date">ACTIVE PERSONNEL: ${dataMgmt.length}</span>
                            </div>
                        </div>
                        <div class="slide-content">
                            <table class="table-fullheight">
                                <thead style="display:flex; width:100%;">
                                    <tr style="display:flex; width:100%;">
                                        <th style="width: 20%">ผู้รับผิดชอบ (OFFICER)</th>
                                        <th style="width: 20%">ภารกิจหลัก (DIRECTIVE)</th>
                                        <th style="width: 60%">รายละเอียดงาน (${periodStr})</th>
                                    </tr>
                                </thead>
                                <tbody>${mgmtRowsHTML}</tbody>
                            </table>
                        </div>
                    </div>`;
                slideIndex++;
            });

            // --- Breakdown Slides ---
            const repairChunks = chunkArray(dataRepair, MAX_ROWS_PER_PAGE);
            repairChunks.forEach((chunk, pageIdx) => {
                const pageText = repairChunks.length > 1 ? ` (หน้า ${pageIdx + 1}/${repairChunks.length})` : '';
                let repairRowsHTML = chunk.length > 0 ? chunk.map(r => {
                    const stat = currentMode === 'morning' ? r.statusM : r.statusA;
                    const col = currentMode === 'morning' ? r.cM : r.cA;
                    return `<tr style="display:flex; width:100%;">
                        <td style="width:8%; justify-content:center; font-family:'Share Tech Mono',monospace;">${r.timeAlert}</td>
                        <td style="width:22%; justify-content:flex-start; color:#fff; font-weight: 500;">${r.place}</td>
                        <td style="width:22%; justify-content:flex-start; color:var(--cyan-glow);">${r.issue}</td>
                        <td style="width:12%; justify-content:flex-start;">${r.name}</td>
                        <td style="width:9%; justify-content:center; font-family:'Share Tech Mono',monospace;">${r.timeArrive}</td>
                        <td style="width:9%; justify-content:center; font-family:'Share Tech Mono',monospace;">${r.timeFinish}</td>
                        <td style="width:18%; justify-content:flex-start;" class="status-${col}">${getStatusIcon(col)}${stat}</td>
                    </tr>`;
                }).join('') : '<tr style="display:flex; width:100%;"><td style="width:100%; justify-content:center; color:var(--gray-color);">ไม่พบข้อมูลแจ้งซ่อมฉุกเฉินในขณะนี้ (NO BREAKDOWN REPORTS)</td></tr>';

                container.innerHTML += `
                    <div class="slide" id="slide-${slideIndex}">
                        <div class="laser-line"></div>
                        <div class="slide-header">
                            ${logoHeaderHTML}
                            <div class="slide-title">
                                <span>ระบบรับแจ้งซ่อมฉุกเฉิน (EMERGENCY BREAKDOWN MONITORING)${pageText}</span>
                                <span class="slide-date">LIVE TICKETS (${periodStr})</span>
                            </div>
                        </div>
                        <div class="slide-content">
                            <table class="table-fullheight">
                                <thead style="display:flex; width:100%;">
                                    <tr style="display:flex; width:100%;">
                                        <th style="width: 8%; justify-content:center;">เวลาแจ้ง</th>
                                        <th style="width: 22%">ลูกค้า / สถานที่</th>
                                        <th style="width: 22%">อาการเบื้องต้น</th>
                                        <th style="width: 12%">ช่างที่รับงาน</th>
                                        <th style="width: 9%; justify-content:center;">ถึงหน้างาน</th>
                                        <th style="width: 9%; justify-content:center;">แก้จบงาน</th>
                                        <th style="width: 18%">สถานะการซ่อม (${periodStr})</th>
                                    </tr>
                                </thead>
                                <tbody>${repairRowsHTML}</tbody>
                            </table>
                        </div>
                    </div>`;
                slideIndex++;
            });

            // --- Slide Map ---
            container.innerHTML += `
                <div class="slide" id="slide-${slideIndex}">
                    <div class="laser-line"></div>
                    <div class="slide-header">
                        ${logoHeaderHTML}
                        <div class="slide-title">
                            <span>แผนที่พิกัดปฏิบัติการ (TACTICAL OPERATIONS MAP)</span>
                            <span class="slide-date">LIVE GPS TRACKING</span>
                        </div>
                    </div>
                    <div class="slide-content">
                        <div id="map-container"></div>
                    </div>
                </div>`;

            totalSlidesCount = slideIndex; 
            document.getElementById('total-slides').textContent = totalSlidesCount;
            
            updatePieChart(); renderYTDCharts();
            if (currentSlide > totalSlidesCount) currentSlide = 1;
            showSlide(currentSlide); scalePresentation();
        }

        function initMap() {
            const mapEl = document.getElementById('map-container');
            if (!mapEl || map) return;
            map = L.map('map-container').setView([13.7563, 100.5018], 8);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
        }

        function createPinIcon(color) {
            let colorHex = color === 'red' ? '#ff2a2a' : (color === 'yellow' ? '#facc15' : (color === 'blue' ? '#00f0ff' : '#22c55e'));
            let extraClass = color === 'red' ? 'custom-map-pin-red' : '';
            return L.divIcon({
                className: `custom-map-pin ${extraClass}`,
                html: `<div style="background-color: ${colorHex}; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #010409; box-shadow: 0 0 15px ${colorHex};"></div>`,
                iconSize: [20, 20], iconAnchor: [10, 10], popupAnchor: [0, -10]
            });
        }

        function updateMapMarkers() {
            if (!map) return;
            mapMarkers.forEach(m => map.removeLayer(m)); mapMarkers = [];
            const allTeamData = [...dataTiw, ...dataPele, ...dataJet, ...dataNut, ...dataUpcountry];
            const bounds = [];

            allTeamData.forEach(item => {
                if (item.coords && item.coords.includes(',')) {
                    const [lat, lng] = item.coords.split(',').map(Number);
                    if (!isNaN(lat) && !isNaN(lng)) {
                        const col = currentMode === 'morning' ? item.cM : item.cA;
                        const stat = currentMode === 'morning' ? item.statusM : item.statusA;
                        const popupHTML = `
                            <div style="font-family:'Prompt',sans-serif; color:#fff; font-size:13px; line-height:1.5; padding:5px;">
                                <strong style="font-size:15px; color:var(--cyan-glow);">[${item.place}]</strong><br>
                                <b>ทีม:</b> ${item.team} (${item.name})<br>
                                <b>สถานะ:</b> ${getStatusIcon(col)} ${stat}
                            </div>`;
                        const marker = L.marker([lat, lng], { icon: createPinIcon(col) }).addTo(map).bindPopup(popupHTML);
                        mapMarkers.push(marker); bounds.push([lat, lng]);
                    }
                }
            });

            if (bounds.length > 0) { map.fitBounds(bounds, { padding: [50, 50] }); }
        }

        function showSlide(n) {
            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            const targetSlide = document.getElementById('slide-' + n);
            if (targetSlide) targetSlide.classList.add('active');
            document.getElementById('current-slide').textContent = n;

            if (n === 1) {
                const totalField = dataTiw.length + dataPele.length + dataJet.length + dataNut.length + dataUpcountry.length;
                let repairActive = dataRepair.filter(r => r.place !== '-' && r.place !== '').length;
                let alertCount = [...dataTiw, ...dataPele, ...dataJet, ...dataNut, ...dataUpcountry].filter(r => {
                    const col = currentMode === 'morning' ? r.cM : r.cA; return col === 'red' || col === 'yellow';
                }).length;
                animateNumberCount('kpi-total', totalField + dataMgmt.length);
                animateNumberCount('kpi-teams', 5);
                animateNumberCount('kpi-repair', repairActive);
                animateNumberCount('kpi-alerts', alertCount);
            }
            if (n === totalSlidesCount) { setTimeout(() => { initMap(); if (map) { map.invalidateSize(true); updateMapMarkers(); } }, 400); }
        }

        function nextSlide() { currentSlide = currentSlide >= totalSlidesCount ? 1 : currentSlide + 1; showSlide(currentSlide); }
        function prevSlide() { currentSlide = currentSlide <= 1 ? totalSlidesCount : currentSlide - 1; showSlide(currentSlide); }

        function togglePlay() {
            const btn = document.getElementById('btn-play');
            if (isPlaying) { clearInterval(playInterval); btn.innerHTML = 'เล่นสไลด์อัตโนมัติ'; btn.classList.remove('playing'); } 
            else { playInterval = setInterval(nextSlide, 20000); btn.innerHTML = 'หยุดเล่นอัตโนมัติ'; btn.classList.add('playing'); }
            isPlaying = !isPlaying;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); }
            else { if (document.exitFullscreen) document.exitFullscreen(); }
        }

        document.getElementById('btn-next').addEventListener('click', nextSlide);
        document.getElementById('btn-prev').addEventListener('click', prevSlide);
        document.getElementById('btn-play').addEventListener('click', togglePlay);
        document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);
        document.getElementById('btn-sync').addEventListener('click', loadAllDataFromGoogleSheets);

        function scalePresentation() {
            const container = document.getElementById('presentation-container');
            const scale = Math.min(container.clientWidth / 1280, container.clientHeight / 720);
            document.querySelectorAll('.slide').forEach(slide => slide.style.transform = `scale(${scale})`);
        }
        window.addEventListener('resize', scalePresentation);

        loadAllDataFromGoogleSheets().then(() => { togglePlay(); });
        setInterval(loadAllDataFromGoogleSheets, 300000);
    </script>
</body>
</html>
