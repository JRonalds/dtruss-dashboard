    <style>
        :root {
            --bg-color: #070C1B;
            --gold-color: #D4AF37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --white-color: #FFFFFF;
            --gray-color: #94A3B8;
            --panel-bg: #111827;
            --row-even: #182238;
            --row-odd: #0F172A;
            --slide-width: 1280px;
            --slide-height: 680px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #000;
            color: var(--white-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
        }

        /* Top Control Bar */
        #tv-controls {
            width: 100%;
            background: #0B1120;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold-color);
            box-shadow: 0 0 15px var(--gold-glow);
            z-index: 1000;
            flex-shrink: 0;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .digital-clock {
            font-family: 'Share Tech Mono', monospace;
            font-size: 18px;
            color: #38bdf8;
            background: rgba(15, 23, 42, 0.8);
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
            letter-spacing: 1px;
            margin-right: 15px;
        }

        button {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.2); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        button.active-mode {
            background: var(--gold-color);
            color: #000;
            border-color: var(--gold-color);
            font-weight: 600;
            box-shadow: 0 0 10px var(--gold-glow);
        }

        .btn-sync { background: #0284c7; border-color: #0369a1; }

        .btn-play { background: #2563eb; border-color: #1d4ed8; }
        .btn-play.playing { background: #dc2626; border-color: #b91c1c; animation: sirenPulse 1.5s infinite; }
        .btn-fullscreen { background: #7c3aed; border-color: #6d28d9; }

        .slide-counter {
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 13px;
            color: var(--gold-color);
            font-weight: 600;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* Bottom Live Ticker */
        #ticker-bar {
            width: 100%;
            height: 36px;
            background: #030712;
            border-top: 1px solid var(--gold-color);
            display: flex;
            align-items: center;
            overflow: hidden;
            z-index: 1000;
            flex-shrink: 0;
            position: relative;
        }

        .ticker-label {
            background: #dc2626;
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            padding: 0 15px;
            height: 100%;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
            box-shadow: 5px 0 10px rgba(0,0,0,0.5);
            flex-shrink: 0;
            animation: sirenPulse 2s infinite;
        }

        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 30s linear infinite;
            font-size: 14px;
            color: #e2e8f0;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* Slide Container */
        #presentation-container {
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #000;
        }

        .slide {
            width: var(--slide-width);
            height: var(--slide-height);
            background-color: var(--bg-color);
            position: absolute;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease-in-out;
            transform-origin: center center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        .gold-line {
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #D4AF37, #fef08a, #D4AF37);
            position: absolute;
            top: 0;
            left: 0;
            box-shadow: 0 0 10px var(--gold-glow);
        }

        .slide-header { padding: 25px 35px 10px; }

        .logo-text {
            color: var(--gold-color);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 8px var(--gold-glow);

        .slide-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--white-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
        }

        .slide-date {
            font-size: 14px;
            font-weight: 400;
            color: var(--gray-color);
            background: rgba(255,255,255,0.05);
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .slide-content {
            padding: 10px 35px 20px;
            height: calc(100% - 105px);
            display: flex;
            flex-direction: column;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            flex-grow: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            overflow: hidden;
            table-layout: fixed;
        }

        th {

            padding: 10px 14px;
            text-align: left;

            padding: 8px 14px;

            line-height: 1.3;

            overflow: hidden;
            text-overflow: ellipsis;

        tr:nth-child(even) td { background-color: var(--row-even); }
        tr:nth-child(odd) td { background-color: var(--row-odd); }

        .status-yellow { color: #facc15; font-weight: 500; }

        }
        .status-blue { color: #60a5fa; font-weight: 500; }
        .status-gray { color: var(--gray-color); font-weight: 400; }

        @keyframes sirenPulse {
            0% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.6); }
            50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.9); border-color: rgba(239, 68, 68, 1); }
            100% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.6); }

        /* Summary Grid */
        .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 15px; flex-shrink: 0; }

        .summary-title { font-size: 13px; color: var(--gray-color); margin-bottom: 4px; }
        .summary-value { font-size: 32px; font-weight: 700; color: var(--white-color); }
        .summary-sub { font-size: 12px; color: var(--gold-color); margin-top: 2px; }

        .bottom-section { display: flex; gap: 15px; flex: 1; min-height: 0; }
        
        .alert-box {
            flex: 1; background: rgba(220, 38, 38, 0.12); border-left: 4px solid #ef4444; 
            padding: 14px 18px; border-radius: 0 8px 8px 0; display: flex; flex-direction: column;

        .alert-content { flex: 1; overflow-y: auto; padding-right: 5px; }
        .alert-item { font-size: 14px; margin-bottom: 6px; padding-left: 15px; position: relative; }
        .alert-item::before { content: '•'; color: #ef4444; position: absolute; left: 0; font-weight: bold; }

        .chart-box {
            background: var(--panel-bg); border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.08); padding: 14px; 
            border-top: 3px solid var(--gold-color); display: flex; flex-direction: column;

        }
        .chart-title { font-size: 14px; color: var(--gray-color); margin-bottom: 4px; text-align: left; flex-shrink: 0; font-weight: 600; }
        .chart-container-inner { flex: 1; position: relative; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }

        /* Map Container & Dark Filter */
        #map-container {
            width: 100%; height: 100%; border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden; z-index: 1;
            background: #0b0f19;

        .leaflet-tile-pane {

        .leaflet-popup-tip { background: var(--gold-color) !important; }

        .custom-map-pin-red {
            animation: sirenPulse 1.2s infinite;
            border-radius: 50%;
        }
    </style>
</head>

            { project: 'เดอะมาสเตอร์ เซ็นเธรี่ยม', calls: 36, door: 9, stuck: 8, trapped: 0, status: '🟢 ปกติ', color: 'green' },

            { project: 'เมืองทองธานี T9', calls: 28, door: 5, stuck: 9, trapped: 2, status: '🟡 เฝ้าระวังไฟตก', color: 'yellow' }
        ];

        let dataTiw = [], dataPele = [], dataJet = [], dataNut = [], dataUpcountry = [], dataMgmt = [], dataRepair = [];
        let currentMode = 'morning';
        let currentSlide = 1;

        // Digital Clock
        function updateDigitalClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-digital-clock').textContent = `${h}:${m}:${s}`;
        }
        setInterval(updateDigitalClock, 1000);
        updateDigitalClock();

        // Count-Up Animation
        function animateNumberCount(id, targetVal) {
            const el = document.getElementById(id);
            if (!el) return;
            let current = 0;
            const increment = Math.ceil(targetVal / 20) || 1;
            const timer = setInterval(() => {
                current += increment;
                if (current >= targetVal) {
                    current = targetVal;
                    clearInterval(timer);
                }
                el.childNodes[0].nodeValue = current + ' ';
            }, 30);
        }

        function getStatusIcon(colorClass) {
            if (colorClass === 'green') return '🟢 ';
            if (colorClass === 'blue') return '🔵 ';
            if (colorClass === 'yellow') return '🟡 ';
            if (colorClass === 'red') return '🚨 ';
            return '';
        }

        function parseTimeValue(val) {
            if (!val || val === '-') return '-';
            val = String(val).trim();
            if (val.startsWith('Date(')) {
                const matches = val.match(/\d+/g);
                if (matches && matches.length >= 5) {
                    const h = String(matches[3]).padStart(2, '0');
                    const m = String(matches[4]).padStart(2, '0');
                    return `${h}:${m}`;
                }
            }
            return val;
        }

        function isRowNotEmpty(r) {
            if (!r || r.length === 0) return false;
            const col0 = r[0] ? String(r[0]).trim() : '';
            const col1 = r[1] ? String(r[1]).trim() : '';
            return (col0 !== '' && col0 !== '-') || (col1 !== '' && col1 !== '-');
        }

        function chunkArray(array, chunkSize) {
            if (!array || array.length === 0) return [[]];
            const results = [];
            for (let i = 0; i < array.length; i += chunkSize) {
                results.push(array.slice(i, i + chunkSize));
            }
            return results;
        }

        function fetchSheetTab(sheetName) {
            return new Promise((resolve) => {
                if (!GOOGLE_SHEET_ID) return resolve(null);
                const callbackName = 'sheet_cb_' + Math.random().toString(36).substring(2, 9);
                
                const timeout = setTimeout(() => {
                    if (window[callbackName]) {
                        delete window[callbackName];
                        if (script.parentNode) script.parentNode.removeChild(script);
                        resolve(null);
                    }
                }, 15000); 

                window[callbackName] = function(data) {
                    clearTimeout(timeout);
                    delete window[callbackName];
                    if (script.parentNode) script.parentNode.removeChild(script);

                    if (data && data.table && data.table.rows) {
                        const rows = data.table.rows.map(row => 
                            row.c ? row.c.map(cell => cell ? (cell.v !== null && cell.v !== undefined ? String(cell.v) : '') : '') : []
                        );
                        resolve(rows);
                    } else { resolve(null); }
                };

                const script = document.createElement('script');
                script.src = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=responseHandler:${callbackName}`;
                script.onerror = function() {
                    clearTimeout(timeout);
                    delete window[callbackName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    resolve(null);
                };
                document.body.appendChild(script);
            });
        }

        function isHeaderRow(firstCell, headerKey) {
            return firstCell && firstCell.toString().trim() === headerKey;
        }

        function parseTeamRows(rows, teamLabel) {
            if (!rows || rows.length === 0) return [];
            const startIndex = isHeaderRow(rows[0][0], 'ช่าง') ? 1 : 0;
            return rows.slice(startIndex)
                .filter(isRowNotEmpty)
                .map(r => ({
                    team: teamLabel,
                    name: r[0] ? String(r[0]).trim() : '-',
                    place: r[1] ? String(r[1]).trim() : '-',
                    code: r[2] ? String(r[2]).trim() : '-',
                    qty: r[3] ? String(r[3]).trim() : '-',
                    contact: r[4] ? String(r[4]).trim() : '-',
                    statusM: r[5] ? String(r[5]).trim() : '-',
                    cM: (r[6] ? String(r[6]).trim() : 'green').toLowerCase(),
                    statusA: r[7] ? String(r[7]).trim() : '-',
                    cA: (r[8] ? String(r[8]).trim() : 'green').toLowerCase(),
                    coords: r[9] ? String(r[9]).trim() : ''
                }));
        }

        async function loadAllDataFromGoogleSheets() {
            if (isFetching) return;
            isFetching = true;

                    <div class="slide-header">
                        <div class="logo-text">DTRUSS ELEVATOR | Operations Command Center</div>
                        <div class="slide-title">
                            <span>FIELD OPERATIONS MAP (แผนที่ตำแหน่งงานปฏิบัติการ)</span>
                            <span class="slide-date">อ้างอิงพิกัดจากโครงการประจำวัน</span>
                        </div>
                    </div>
                    <div class="slide-content">
                        <div id="map-container"></div>
                    </div>
                </div>`;

            totalSlidesCount = slideIndex; 
            document.getElementById('total-slides').textContent = totalSlidesCount;
            
            updatePieChart();
            renderYTDCharts();

            if (currentSlide > totalSlidesCount) currentSlide = 1;
            showSlide(currentSlide);
            scalePresentation();
        }

        // Leaflet Map Initialization
        function initMap() {
            const mapEl = document.getElementById('map-container');
            if (!mapEl || map) return;
            map = L.map('map-container').setView([13.7563, 100.5018], 8);
            
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri'
            }).addTo(map);
        }

        function createPinIcon(color) {
            let colorHex = '#4ade80';
            let extraClass = '';
            if (color === 'blue') colorHex = '#60a5fa';
            if (color === 'yellow') colorHex = '#facc15';
            if (color === 'red') {
                colorHex = '#ef4444';
                extraClass = 'custom-map-pin-red';
            }
            if (color === 'gray') colorHex = '#94A3B8';

            return L.divIcon({
                className: `custom-map-pin ${extraClass}`,
                html: `<div style="background-color: ${colorHex}; width: 22px; height: 22px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 0 12px ${colorHex};"></div>`,
                iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -12]
            });
        }

        function updateMapMarkers() {
            if (!map) return;
            mapMarkers.forEach(m => map.removeLayer(m));
            mapMarkers = [];

            const allTeamData = [...dataTiw, ...dataPele, ...dataJet, ...dataNut, ...dataUpcountry];
            const bounds = [];

            allTeamData.forEach(item => {
                if (item.coords && item.coords.includes(',')) {
                    const parts = item.coords.split(',');
                    const lat = parseFloat(parts[0]);
                    const lng = parseFloat(parts[1]);

                    if (!isNaN(lat) && !isNaN(lng)) {
                        const col = currentMode === 'morning' ? item.cM : item.cA;
                        const stat = currentMode === 'morning' ? item.statusM : item.statusA;

                        const popupHTML = `
                            <div style="font-family:'Prompt',sans-serif; color:#fff; font-size:13px; line-height:1.5; padding:5px;">
                                <strong style="font-size:15px; color:var(--gold-color);">🏢 ${item.place}</strong><br>
                                <b>ทีม:</b> ${item.team} (${item.name})<br>
                                <b>CODE:</b> ${item.code} (${item.qty} ชั้น)<br>
                                <b>ผู้ติดต่อ:</b> ${item.contact}<br>
                                <b>สถานะ:</b> ${getStatusIcon(col)} ${stat}
                            </div>`;

                        const marker = L.marker([lat, lng], { icon: createPinIcon(col) }).addTo(map).bindPopup(popupHTML);
                        mapMarkers.push(marker);
                        bounds.push([lat, lng]);
                    }
                }
            });

            if (bounds.length > 0) { map.fitBounds(bounds, { padding: [50, 50] }); }
        }

        // Slide Navigation
        function showSlide(n) {
            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            const targetSlide = document.getElementById('slide-' + n);
            if (targetSlide) targetSlide.classList.add('active');
            document.getElementById('current-slide').textContent = n;

            if (n === 1) {
                const totalField = dataTiw.length + dataPele.length + dataJet.length + dataNut.length + dataUpcountry.length;
                let repairActive = dataRepair.filter(r => r.place !== '-' && r.place !== '').length;
                let alertCount = [...dataTiw, ...dataPele, ...dataJet, ...dataNut, ...dataUpcountry].filter(r => {
                    const col = currentMode === 'morning' ? r.cM : r.cA;
                    return col === 'red' || col === 'yellow';
                }).length;

                animateNumberCount('kpi-total', totalField + dataMgmt.length);
                animateNumberCount('kpi-teams', 5);
                animateNumberCount('kpi-repair', repairActive);
                animateNumberCount('kpi-alerts', alertCount);
            }

            if (n === totalSlidesCount) {
                setTimeout(() => {
                    initMap();
                    if (map) {
                        map.invalidateSize(true);
                        updateMapMarkers();
                    }
                }, 400);
            }
        }

        function nextSlide() { currentSlide = currentSlide >= totalSlidesCount ? 1 : currentSlide + 1; showSlide(currentSlide); }
        function prevSlide() { currentSlide = currentSlide <= 1 ? totalSlidesCount : currentSlide - 1; showSlide(currentSlide); }

        function togglePlay() {
            const btn = document.getElementById('btn-play');
            if (isPlaying) {
                clearInterval(playInterval);
                btn.innerHTML = '▶ เล่นสไลด์วนทีวี (20s)';
                btn.classList.remove('playing');
            } else {
                playInterval = setInterval(nextSlide, 20000);
                btn.innerHTML = '⏸ หยุดเล่นอัตโนมัติ';
                btn.classList.add('playing');
            }
            isPlaying = !isPlaying;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); }
            else { if (document.exitFullscreen) document.exitFullscreen(); }
        }

        // Controls Event Listeners
        document.getElementById('btn-next').addEventListener('click', nextSlide);
        document.getElementById('btn-prev').addEventListener('click', prevSlide);
        document.getElementById('btn-play').addEventListener('click', togglePlay);
        document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);
        document.getElementById('btn-sync').addEventListener('click', loadAllDataFromGoogleSheets);

        document.getElementById('btn-morning').addEventListener('click', (e) => {
            currentMode = 'morning';
            e.target.classList.add('active-mode');
            document.getElementById('btn-afternoon').classList.remove('active-mode');
            renderDynamicSlides();
        });

        document.getElementById('btn-afternoon').addEventListener('click', (e) => {
            currentMode = 'afternoon';
            e.target.classList.add('active-mode');
            document.getElementById('btn-morning').classList.remove('active-mode');
            renderDynamicSlides();
        });

        function scalePresentation() {
            const container = document.getElementById('presentation-container');
            const scale = Math.min(container.clientWidth / 1280, container.clientHeight / 680);
            document.querySelectorAll('.slide').forEach(slide => slide.style.transform = `scale(${scale})`);
        }
        window.addEventListener('resize', scalePresentation);

        // Initial Load
        loadAllDataFromGoogleSheets();
        setInterval(loadAllDataFromGoogleSheets, 300000);
    </script>
</body>
</html>
